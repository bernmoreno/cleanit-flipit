<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore all cleaning and property transformation services offered by Clean It Flip It — house cleaning, deep clean, move-in/out, post-renovation, and more." />
  <title>Services | Clean It Flip It</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
</head>
<body>

  <div id="navbar-root"></div>

  <main class="page-content" id="main-content">

    <!-- ---- Pricing --------------------------------------- -->
    <section class="section section--gray" aria-labelledby="pricing-heading">
      <div class="container">
        <div class="section__header">
          <span class="section__eyebrow">Pricing</span>
          <h2 class="section__title" id="pricing-heading">Simple, Transparent Pricing</h2>
          <p class="section__subtitle">&nbsp;</p>
        </div>
        <div style="display:flex;justify-content:center;">
          <img
            src="images/pricing.png"
            alt="Clean It Flip It pricing packages"
            style="width:100%;max-width:900px;border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.12);display:block;"
            loading="lazy"
          />
        </div>
        <p style="text-align:center;margin-top:28px;color:var(--color-muted);font-size:.9rem;">
          Need a custom quote?
          <a href="contact.html" style="color:var(--color-primary);font-weight:600;">Contact us</a>
          and we'll tailor a package just for you.
        </p>
      </div>
    </section>

    <!-- ---- CTA Band ------------------------------------- -->
    <section class="cta-band" aria-labelledby="services-cta-heading">
      <div class="container">
        <h2 class="cta-band__title" id="services-cta-heading">Ready to Book Your First Clean?</h2>
        <span class="cta-band__sub">Get 10% off your first service when you book online today.</span>
        <a href="contact.html" class="btn btn--white">Request a Free Quote</a>
      </div>
    </section>

  </main>

  <div id="footer-root"></div>

  <script src="js/navbar.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
